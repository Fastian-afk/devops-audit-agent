[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "devops-audit-agent"
version = "1.0.0"
description = "Autonomous DevOps Repository Auditing Agent — portfolio-grade AI agent built without frameworks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "DevOps Audit Agent", email = "devops-audit@example.com" }]
keywords = ["devops", "auditing", "ai-agent", "security", "ci-cd"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "google-genai>=1.16.0",
    "openai>=1.59.9",
    "python-dotenv>=1.0.1",
    "jsonschema>=4.23.0",
    "ruff>=0.9.0",
    "gitpython>=3.1.44",
    "pyyaml>=6.0.1",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
]

[project.scripts]
devops-audit = "agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_core*"]

# ============================================================
# Ruff Configuration — strict linting for portfolio-grade code
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    ".eggs",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit security
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
]
ignore = [
    "S101",   # Use of assert (needed in tests)
    "S603",   # subprocess call — we handle this intentionally with sandboxing
    "S607",   # partial-path call — handled intentionally
    "S301",   # pickle: not used
    "S324",   # hashlib.md5 used for deduplication fingerprint, not cryptographic security
    "S110",   # try-except-pass — used intentionally for best-effort optional operations
    "B008",   # do not perform function calls in defaults
    "S104",   # binding to all interfaces — not applicable
    "N806",   # variable in function should be lowercase — false positive on some patterns
    "SIM108", # use ternary operator — less readable for complex conditions
    "SIM102", # nested if — clarity preferred over combining
    "E501",   # line too long — acceptable in tool output strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM"]     # Relax security/simplify rules in tests

[tool.ruff.lint.isort]
known-first-party = ["agent_core"]

# ============================================================
# Pytest Configuration
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]
timeout = 60
markers = [
    "unit: pure unit tests with no external I/O",
    "integration: tests that clone real repos or call real LLMs",
    "slow: tests that take more than a few seconds",
]

# ============================================================
# Coverage Configuration
# ============================================================
[tool.coverage.run]
source = ["agent_core", "tools", "agent"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
