name: CI — DevOps Audit Agent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege permissions — only read access needed for CI
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524bc47e64dbfcdde4a5ee3c293c4b39523  # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff (no --no-verify, no || true)
        run: ruff check .

      - name: Check ruff formatting
        run: ruff format --check .

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_agent_loop.py \
            -m "not integration"
        env:
          # No real API keys — tests use mocks only
          PROVIDER: mock
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524bc47e64dbfcdde4a5ee3c293c4b39523  # v5.4.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff with security rules (bandit-equivalent)
        run: ruff check . --select S --output-format=github
